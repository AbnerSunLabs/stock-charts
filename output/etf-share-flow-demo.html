<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ETF 份额流向</title>
    <meta
      name="description"
      content="按份额变动看 ETF 净申购。宽基按指数分列，行业主题按已跟踪的 8 只分列。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@500;600&family=Geist:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f2c25'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='14' fill='white' font-family='sans-serif'%3E份%3C/text%3E%3C/svg%3E"
    />
    <style>
      /* 语义色沿用点位页 A 股语系：绿=净申购（买入），红=净赎回（卖出），琥珀=异常 / 当前 */
      :root {
        --bg-main: #f1f5f9;
        --surface: #ffffff;
        --surface-2: #f8faf7;
        --line: #e6e9e2;
        --line-strong: #d8ddd3;
        --text: #1f2c25;
        --muted: #67746b;
        --soft: #8d9a90;
        --green: #2e8a68;
        --green-soft: #e7f2ec;
        --red: #ce4630;
        --red-soft: #fbede9;
        --amber: #e8a33d;
        --amber-deep: #9a6b10;
        --amber-soft: #f9f1df;
        --accent: #2563eb;
        --font-num: ui-monospace, "SF Mono", Menlo, monospace;
        --ds-shadow-lg: 0 8px 20px rgba(10, 11, 13, 0.06);
        --z-tooltip: 99999;
        --page-max-wide: 1440px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg-main);
        color: var(--text);
        font:
          14px/20px Geist,
          "PingFang SC",
          "Noto Sans SC",
          sans-serif;
        font-weight: 400;
        -webkit-font-smoothing: antialiased;
      }
      i,
      em {
        font-style: normal;
      }
      main {
        padding: 32px 40px 48px;
      }
      .page {
        max-width: var(--page-max-wide);
        margin: 0 auto;
      }
      .num {
        font-family: var(--font-num);
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.02em;
      }
      .pos {
        color: var(--green);
      }
      .neg {
        color: var(--red);
      }
      .up {
        color: var(--red);
      }
      .down {
        color: var(--green);
      }

      .crumb {
        margin-bottom: 16px;
        color: var(--muted);
        font-size: 13px;
      }
      .crumb a {
        color: var(--muted);
        text-decoration: none;
      }
      .crumb a:hover {
        color: var(--text);
      }
      .crumb i {
        margin: 0 8px;
        font-style: normal;
        color: var(--soft);
      }

      /* 页头 */
      .page-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .subtitle {
        color: var(--muted);
        font-size: 12px;
      }
      .head-right {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .field-label {
        color: var(--muted);
        font-size: 12px;
      }
      select,
      input[type="search"] {
        padding: 7px 12px;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
        font-size: 13px;
        outline: none;
      }
      select:focus,
      input[type="search"]:focus {
        border-color: var(--green);
        box-shadow: 0 0 0 3px var(--green-soft);
      }
      .src-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--surface);
        font-size: 12px;
        color: var(--muted);
      }
      .src-chip b {
        color: var(--text);
        font-weight: 600;
      }
      .src-chip .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--green);
      }
      .src-chip.pending .dot {
        background: var(--amber);
      }
      .src-chip.pending b {
        color: var(--amber-deep);
      }

      /* 卡片 */
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
      }
      .card-pad {
        padding: 16px 18px;
      }
      .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }
      .card-title {
        font-size: 15px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .card-sub {
        color: var(--muted);
        font-size: 12px;
      }
      .sec-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 28px 0 12px;
        flex-wrap: wrap;
      }
      .sec-title h2 {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      /* 分段按钮 */
      .seg {
        display: inline-flex;
        padding: 2px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface-2);
      }
      .seg button {
        padding: 4px 12px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      .seg button:hover {
        color: var(--text);
      }
      .seg button.on {
        background: var(--surface);
        color: var(--text);
        font-weight: 600;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
      }
      .seg button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .tools {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      /* 阈值步进 */
      .stepper {
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: var(--surface);
      }
      .stepper button {
        width: 28px;
        height: 28px;
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 15px;
        cursor: pointer;
      }
      .stepper button:hover {
        color: var(--text);
      }
      .stepper span {
        min-width: 36px;
        text-align: center;
        font-size: 13px;
        font-weight: 600;
      }

      /* 本周读数 */
      .kpis {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }
      .band-label {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin: 16px 0 8px;
        font-size: 13px;
        font-weight: 700;
      }
      .band-label .card-sub {
        font-weight: 400;
      }
      @media (max-width: 1180px) {
        .kpis {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      .kpi {
        padding: 14px 16px;
        cursor: pointer;
        transition:
          border-color 0.15s ease,
          box-shadow 0.15s ease;
        text-align: left;
        font: inherit;
        color: inherit;
      }
      .kpi:hover {
        border-color: var(--line-strong);
      }
      .kpi.on {
        border-color: var(--text);
        box-shadow: 0 0 0 1px var(--text);
      }
      .kpi.total {
        background: var(--surface-2);
      }
      .kpi-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 8px;
      }
      .kpi-name {
        font-weight: 700;
        font-size: 14px;
      }
      .kpi-reps {
        color: var(--muted);
        font-size: 11.5px;
        margin-top: 2px;
      }
      .badge {
        flex: none;
        padding: 1px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
      }
      .badge.anomaly {
        background: var(--amber-soft);
        color: var(--amber-deep);
        border: 1px solid #f0d9a8;
      }
      .badge.normal {
        background: var(--surface-2);
        color: var(--soft);
        border: 1px solid var(--line);
      }
      .badge.bg {
        background: transparent;
        color: var(--soft);
        border: 1px dashed var(--line-strong);
      }
      .kpi-val {
        margin-top: 10px;
        font-size: 26px;
        font-weight: 700;
        line-height: 1.15;
      }
      .kpi-val small {
        font-size: 12px;
        font-weight: 500;
        color: var(--muted);
        margin-left: 4px;
        font-family: inherit;
      }
      .kpi-val.pending {
        font-size: 18px;
        color: var(--amber-deep);
        font-family: inherit;
      }
      .kpi-cap {
        margin-top: 4px;
        font-size: 12px;
        color: var(--muted);
      }
      .kpi-cap b {
        color: var(--text);
        font-weight: 600;
      }
      .kpi-foot {
        margin-top: 10px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 8px;
      }
      .kpi-idx {
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
      }
      .week-bars {
        display: flex;
        gap: 3px;
        align-items: center;
        height: 34px;
      }
      .week-bars .slot {
        width: 12px;
        height: 34px;
        position: relative;
      }
      .week-bars .slot::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        border-top: 1px solid var(--line-strong);
      }
      .week-bars .slot i {
        position: absolute;
        left: 1px;
        right: 1px;
        border-radius: 1px;
      }
      .week-bars .slot.pending {
        border: 1px dashed var(--line-strong);
        border-radius: 2px;
      }
      .week-bars .slot.pending::after {
        display: none;
      }

      /* 信号条 */
      .signal {
        margin-top: 12px;
        display: flex;
        gap: 14px;
        align-items: flex-start;
        padding: 12px 16px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--surface);
      }
      .signal .tag {
        flex: none;
        padding: 3px 10px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 700;
      }
      .signal.buy .tag {
        background: var(--green-soft);
        color: var(--green);
      }
      .signal.sell .tag {
        background: var(--red-soft);
        color: var(--red);
      }
      .signal.none .tag {
        background: var(--surface-2);
        color: var(--soft);
      }
      .signal .body {
        font-size: 13px;
        line-height: 1.6;
      }
      .signal .fail {
        margin-top: 2px;
        color: var(--muted);
        font-size: 12px;
      }

      /* 主图 */
      .legend {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        color: var(--muted);
        font-size: 12px;
      }
      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .legend i {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 2px;
      }
      .legend i.line {
        height: 2px;
        border-radius: 0;
        background: var(--text);
      }
      svg {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
      }
      .axis {
        font-size: 11px;
        fill: var(--soft);
        font-family: var(--font-num);
      }

      /* 长线两列 */
      .long {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
        gap: 12px;
      }
      @media (max-width: 1180px) {
        .long {
          grid-template-columns: 1fr;
        }
      }
      .pct-row {
        display: grid;
        grid-template-columns: 92px minmax(0, 1fr) 108px;
        gap: 12px;
        align-items: center;
        padding: 10px 0;
        border-top: 1px solid var(--line);
      }
      .pct-row:first-of-type {
        border-top: 0;
      }
      .pct-name {
        font-size: 13px;
        font-weight: 600;
      }
      .pct-name small {
        display: block;
        color: var(--soft);
        font-weight: 400;
        font-size: 11px;
      }
      .pct-val {
        text-align: right;
      }
      .pct-val .p {
        font-size: 18px;
        font-weight: 700;
      }
      .pct-val .v {
        font-size: 11.5px;
        color: var(--muted);
      }

      /* 明细表 */
      .table-tools {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .table-tools .seg {
        flex-wrap: wrap;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th {
        position: sticky;
        top: 0;
        background: var(--surface);
        text-align: right;
        font-weight: 500;
        color: var(--muted);
        font-size: 12px;
        padding: 8px 10px;
        border-bottom: 1px solid var(--line-strong);
        white-space: nowrap;
        user-select: none;
      }
      th.sortable {
        cursor: pointer;
      }
      th.sortable:hover {
        color: var(--text);
      }
      th .arrow {
        color: var(--soft);
        margin-left: 2px;
      }
      th.l,
      td.l {
        text-align: left;
      }
      td {
        text-align: right;
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      tbody tr:hover td {
        background: var(--surface-2);
      }
      td .ex {
        display: inline-block;
        padding: 0 6px;
        border-radius: 4px;
        background: var(--surface-2);
        border: 1px solid var(--line);
        font-size: 11px;
        color: var(--muted);
      }
      td.pending {
        color: var(--amber-deep);
        font-size: 12px;
      }
      td.dim {
        color: var(--soft);
      }
      .empty {
        padding: 32px;
        text-align: center;
        color: var(--soft);
      }
      .foot {
        margin-top: 20px;
        color: var(--soft);
        font-size: 12px;
        line-height: 1.7;
      }
      .foot a {
        color: var(--muted);
      }

      /* 问号说明：白底最高层 Tooltip（对齐 .ds-help-tooltip） */
      .help {
        display: inline-flex;
        width: 14px;
        height: 14px;
        color: var(--soft);
        cursor: help;
        vertical-align: -2px;
      }
      .help:hover {
        color: var(--text);
      }
      #tip {
        position: fixed;
        z-index: var(--z-tooltip);
        display: none;
        pointer-events: none;
        max-width: 320px;
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--text);
        box-shadow: var(--ds-shadow-lg);
        font-size: 12px;
        line-height: 1.6;
      }
      #tip .t-h {
        font-weight: 700;
        margin-bottom: 2px;
      }
      #tip .t-r {
        display: flex;
        justify-content: space-between;
        gap: 16px;
      }
      #tip .t-r span:first-child {
        color: var(--muted);
      }

      /* ai-design-skills：字号、间距、圆角、字体、动效收到同一套刻度。工具页不改成落地页。 */
      :root {
        --font-num: "Geist Mono", ui-monospace, monospace;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
      }
      .skip {
        position: absolute;
        left: 16px;
        top: 8px;
        transform: translateY(-48px);
        background: var(--surface);
        color: var(--text);
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 14px;
        line-height: 20px;
        font-weight: 600;
      }
      .skip:focus {
        transform: translateY(0);
      }
      h1,
      h2,
      .band-label {
        text-wrap: balance;
      }
      .subtitle,
      .card-sub,
      .foot,
      .signal .body {
        text-wrap: pretty;
      }
      h1 {
        font-size: 24px;
        line-height: 32px;
        font-weight: 600;
        letter-spacing: 0;
      }
      h2,
      .band-label {
        font-size: 20px;
        line-height: 28px;
        font-weight: 600;
      }
      .subtitle,
      .card-sub,
      .field-label,
      .crumb,
      .src-chip,
      .legend,
      .foot,
      .kpi-reps,
      .kpi-cap,
      .kpi-idx,
      .axis,
      th,
      #tip {
        font-size: 12px;
        line-height: 16px;
        font-weight: 400;
      }
      .field-label,
      .kpi-name,
      .card-title,
      .pct-name,
      th {
        font-weight: 500;
      }
      .kpi-name,
      .card-title,
      .pct-name,
      select,
      input[type="search"],
      .signal .body,
      td {
        font-size: 14px;
        line-height: 20px;
      }
      .card-title {
        font-weight: 500;
      }
      .kpi-val {
        font-size: 24px;
        line-height: 32px;
        font-weight: 600;
      }
      .kpi-val.pending {
        font-size: 16px;
        line-height: 24px;
        font-weight: 500;
      }
      .kpi-val small,
      .pct-val .v,
      .signal .fail,
      .badge,
      td .ex,
      .seg button {
        font-size: 12px;
        line-height: 16px;
      }
      .seg button,
      .signal .tag {
        font-weight: 600;
      }
      .pct-val .p {
        font-size: 18px;
        line-height: 28px;
        font-weight: 600;
      }
      .page-head,
      .card-head,
      .sec-title,
      .signal,
      .legend,
      .long,
      .table-tools {
        gap: 16px;
      }
      .sec-title {
        margin: 32px 0 16px;
      }
      .band-label {
        margin: 16px 0 8px;
      }
      main {
        padding: 32px 40px 48px;
      }
      .card,
      .signal {
        border-radius: 16px;
      }
      .card-pad {
        padding: 16px;
      }
      .kpi {
        padding: 16px;
      }
      select,
      input[type="search"],
      .stepper,
      .seg,
      #tip {
        border-radius: 8px;
      }
      .seg button,
      .signal .tag {
        border-radius: 6px;
      }
      select,
      input[type="search"] {
        padding: 8px 12px;
        font-size: 14px;
        line-height: 20px;
      }
      .seg button {
        padding: 4px 12px;
      }
      .src-chip,
      .badge {
        border-radius: 999px;
      }
      .src-chip {
        padding: 4px 12px;
      }
      button,
      .kpi,
      .seg button,
      select,
      input[type="search"] {
        transition:
          background-color 300ms var(--ease),
          color 300ms var(--ease),
          border-color 300ms var(--ease),
          transform 500ms var(--ease);
      }
      .kpi:hover {
        transform: translateY(-2px);
      }
      .kpi:active,
      .seg button:active,
      .stepper button:active {
        transform: scale(0.98);
      }
      button:focus-visible,
      select:focus-visible,
      input:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--text);
        outline-offset: 2px;
      }
      .help {
        width: 16px;
        height: 16px;
      }
      .help .ph {
        font-size: 16px;
        line-height: 16px;
      }
      .caption-5,
      .dim {
        font-size: 12px;
        line-height: 16px;
        font-weight: 400;
      }
      @media (max-width: 640px) {
        main {
          padding: 16px;
        }
        .kpis,
        .long {
          grid-template-columns: 1fr;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .kpi:hover,
        .kpi:active,
        .seg button:active,
        .stepper button:active {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip" href="#content">跳到份额读数</a>
    <main id="content">
      <div class="page">
        <nav class="crumb" aria-label="当前位置">
          <span>首页</span><i>/</i><span aria-current="page">ETF 份额流向</span>
        </nav>

        <header class="page-head">
          <div>
            <h1>ETF 份额流向</h1>
            <div class="subtitle">
              只看份额变动带来的净申购；规模随指数涨跌变化，不算资金流入。份额按
              T+1 更新。
            </div>
          </div>

        seed |= 0;

        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
      const rng = mulberry32(20261109);
      const gauss = () =>
        Math.sqrt(-2 * Math.log(rng() + 1e-12)) * Math.cos(2 * Math.PI * rng());

      const ymd = (d) => d.toISOString().slice(0, 10);
      const tradingDays = (from, to) => {

        const d = new Date(from + "T00:00:00Z");
        const end = new Date(to + "T00:00:00Z");
        while (d <= end) {
          const w = d.getUTCDay();
          if (w !== 0 && w !== 6) out.push(ymd(d));
          d.setUTCDate(d.getUTCDate() + 1);
        }
        return out;
      };

        const d = new Date(s + "T00:00:00Z");

            g.scale *
            (0.55 * gauss() + g.contra * (-ret / g.vol) * 0.35 + boost);
          close.push(px);
          amt.push(flow);
          shr.push(flow / g.nav);

      });
      const HELP_SVG =
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M140,180a12,12,0,1,1-12-12A12,12,0,0,1,140,180ZM128,72c-22.06,0-40,16.15-40,36v4a8,8,0,0,0,16,0v-4c0-11,10.77-20,24-20s24,9,24,20-10.77,20-24,20a8,8,0,0,0-8,8v8a8,8,0,0,0,16,0v-.72c18.24-3.35,32-17.9,32-35.28C168,88.15,150.06,72,128,72Zm104,56A104,104,0,1,1,128,24,104.11,104.11,0,0,1,232,128Zm-16,0a88,88,0,1,0-88,88A88.1,88.1,0,0,0,216,128Z"/></svg>';
      document
        .querySelectorAll(".help")
        .forEach((n) => (n.innerHTML = HELP_SVG));

      const tipHtml = (head, rows) =>
        `<div class="t-h">${head}</div>` +
        rows
          .map(
            ([k, v]) =>
              `<div class="t-r"><span>${k}</span><span class="num">${v}</span></div>`,
          )
          .join("");
      /* data-tip 属性里嵌 HTML，必须转义引号 */
      const tipAttr = (head, rows) =>
        tipHtml(head, rows).replace(/"/g, "&quot;");

      /* ================= 本周读数 ================= */

      /** 数据日所在自然周的读数；未公布时回退到上一个已公布的周 */
      const weekReading = (s, unit) => {
        const wk = weekKey(state.date);
        const idxs = DAYS.map((d, i) =>
          weekKey(d) === wk && d <= state.date ? i : -1,
        ).filter((i) => i >= 0);
        const lastIdx = idxs.length ? idxs[idxs.length - 1] : N - 1;
        const useIdxs = idxs.length
          ? idxs
          : DAYS.map((d, i) =>
              weekKey(d) === weekKey(DAYS[N - 1]) ? i : -1,
            ).filter((i) => i >= 0);
        const sum = useIdxs.reduce((a, i) => a + s[unit][i], 0);
        const bench = benchAt(s, unit, lastIdx);
        const first = useIdxs[0];
        const idxChg =
          s.close[useIdxs[useIdxs.length - 1]] / s.close[first - 1] - 1;
        const prevIdxChg = s.close[first - 1] / s.close[first - 6] - 1;
        return {
          published: idxs.length > 0,
          idxs: useIdxs,
          sum,
          bench,
          mult: Math.abs(sum) / bench,
          idxChg,
          prevIdxChg,
          from: DAYS[first],
          to: DAYS[useIdxs[useIdxs.length - 1]],
        };
      };

      const weekBarsHtml = (s, r) => {
        const wk = weekKey(state.date);
        const slots = [0, 1, 2, 3, 4].map((k) => {
          const d = new Date(wk + "T00:00:00Z");
          d.setUTCDate(d.getUTCDate() + k);
          return ymd(d);
        });
        const max = Math.max(
          ...r.idxs.map((i) => Math.abs(s.amt[i])),
          r.bench * 2,
        );
        return slots
          .map((day) => {
            const i = DAYS.indexOf(day);
            if (i < 0)
              return day <= state.date
                ? `<div class="slot pending" data-tip="${day}｜尚未公布"></div>`
                : `<div class="slot" style="opacity:.4"></div>`;
            const v = s.amt[i];
            const h = Math.max(2, (Math.abs(v) / max) * 16);
            const st =
              v >= 0
                ? `bottom:17px;height:${h}px;background:var(--green)`
                : `top:17px;height:${h}px;background:var(--red)`;
            return `<div class="slot" data-tip="${tipAttr(day, [["净申购", sign(v) + " 亿元"]])}"><i style="${st}"></i></div>`;
          })
          .join("");
      };

      const renderKpis = () => {
        const paint = (id, list) => {
          const wrap = $(id);
          wrap.innerHTML = "";
          list.forEach((s) => {
            const r = weekReading(s, "amt");
            const isTotal = s.key === "total";
            const anomaly = r.mult >= state.threshold;
            const badge = isTotal
              ? '<span class="badge bg">背景</span>'
              : `<span class="badge ${anomaly ? "anomaly" : "normal"}">${anomaly ? "异常" : "常态"}</span>`;
            const val = isPending()
              ? `<div class="kpi-val pending">本周尚未公布</div><div class="kpi-cap">上周 <b class="num ${dirCls(r.sum)}">${sign(r.sum)}</b> 亿元 · 日均的 <b class="num">${r.mult.toFixed(1)}×</b></div>`
              : `<div class="kpi-val num ${dirCls(r.sum)}">${sign(r.sum)}<small>亿元</small></div><div class="kpi-cap">日均基准 <b class="num">${r.bench.toFixed(1)}</b> 亿 · 本周为其 <b class="num">${r.mult.toFixed(1)}×</b></div>`;
            const card = document.createElement("button");
            card.className =
              "card kpi" +
              (isTotal ? " total" : "") +
              (state.group === s.key ? " on" : "");
            card.innerHTML = `
            <div class="kpi-top"><div><div class="kpi-name">${s.name}</div><div class="kpi-reps">${s.reps}</div></div>${badge}</div>
            ${val}
            <div class="kpi-foot">
              <div class="week-bars">${weekBarsHtml(s, r)}</div>
              <div class="kpi-idx">${s.index} ${isPending() ? "上周" : "本周"} <span class="num ${r.idxChg >= 0 ? "up" : "down"}">${(r.idxChg * 100).toFixed(2)}%</span></div>
            </div>`;
            card.addEventListener("click", () => {
              state.group = s.key;
              renderKpis();
              renderMain();
            });
            wrap.appendChild(card);
          });
        };
        paint("kpis", [...BROAD.map((g) => SERIES[g.key]), SERIES.total]);
        paint(
          "kpis-sector",
          SECTORS.map((g) => SERIES[g.key]),
        );
        renderSignal();
      };

      /** 信号只读沪深300：下跌中异常净申购 = 低位接盘；上涨中份额减少 = 借涨赎回 */
      const renderSignal = () => {
        const s = SERIES.hs300;
        const r = weekReading(s, "amt");
        const el = $("signal");
        const basis = isPending()
          ? `依据上周（${r.from.slice(5)} 至 ${r.to.slice(5)}）。`
          : "";
        const falling = r.idxChg < 0 && r.prevIdxChg < 0;
        const rising = r.idxChg > 0;
        if (falling && r.sum > 0 && r.mult >= state.threshold) {
          el.className = "signal buy";
          el.innerHTML = `<span class="tag">低位接盘</span><div class="body">${basis}沪深300 连续两周下跌（本周 ${(r.idxChg * 100).toFixed(2)}%），净申购 <b class="num">${sign(r.sum)}</b> 亿元，为日均的 <b class="num">${r.mult.toFixed(1)}×</b>。有资金在低位接盘，下跌空间受到限制。
            <div class="fail">失效：托市资金的目标是止跌，下跌结束后停止买入，份额增加不会持续推动上涨。</div></div>`;
        } else if (rising && r.sum < 0) {
          el.className = "signal sell";
          el.innerHTML = `<span class="tag">借涨赎回</span><div class="body">${basis}沪深300 本周上涨 ${(r.idxChg * 100).toFixed(2)}%，份额反而减少（${sign(r.sum)} 亿元）。上涨缺少新增被动资金。</div>`;
        } else {
          el.className = "signal none";
          el.innerHTML = `<span class="tag">无典型信号</span><div class="body">${basis}沪深300 本周为日均的 ${r.mult.toFixed(1)}×，未同时满足「指数连续下跌 + 异常净申购」或「指数上涨 + 份额减少」。</div>`;
        }
      };

      /* ================= 主图：净申购柱 + 指数线 ================= */

      const buildSlots = (s, unit) => {
        const from = Math.max(0, N - state.range);
        const days = [];
        for (let i = from; i < N; i++) days.push(i);
        let slots;
        if (state.gran === "day") {
          slots = days.map((i) => ({
            label: DAYS[i],
            v: s[unit][i],
            close: s.close[i],
            wk: weekKey(DAYS[i]),
            end: i,
          }));
        } else {
          const map = new Map();
          days.forEach((i) => {
            const k = weekKey(DAYS[i]);
            if (!map.has(k))
              map.set(k, { label: k, v: 0, wk: k, end: i, n: 0 });
            const o = map.get(k);
            o.v += s[unit][i];
            o.close = s.close[i];
            o.end = i;
            o.n++;
          });
          slots = [...map.values()];
        }
        /* 每周异常判定：周累计绝对值 / 截至周末的近一年日均 */
        const weekSum = new Map();
        days.forEach((i) => {
          const k = weekKey(DAYS[i]);
          const o = weekSum.get(k) || { v: 0, end: i };
          o.v += s[unit][i];
          o.end = i;
          weekSum.set(k, o);
        });
        slots.forEach((sl) => {
          const w = weekSum.get(sl.wk);
          sl.weekMult = Math.abs(w.v) / benchAt(s, unit, w.end);
          sl.anomaly = sl.weekMult >= state.threshold;
        });
        if (isPending())
          slots.push({
            label: state.gran === "day" ? state.date : weekKey(state.date),
            pending: true,
            wk: weekKey(state.date),
          });
        return slots;
      };

      const renderMain = () => {
        const s = SERIES[state.group];
        const unit = state.unit;
        const slots = buildSlots(s, unit);
        const W = 1200,
          H = 320,
          padL = 56,
          padR = 60,
          padT = 12,
          padB = 28;
        const iw = W - padL - padR,
          ih = H - padT - padB;
        const bw = iw / slots.length;
        const vals = slots.filter((x) => !x.pending).map((x) => x.v);
        const vmax = Math.max(...vals.map(Math.abs)) * 1.1;
        const yv = (v) => padT + ih / 2 - (v / vmax) * (ih / 2);
        const closes = slots.filter((x) => !x.pending).map((x) => x.close);
        const cmin = Math.min(...closes),
          cmax = Math.max(...closes);
        const cpad = (cmax - cmin) * 0.12 || 1;
        const yc = (c) =>
          padT + (1 - (c - cmin + cpad) / (cmax - cmin + 2 * cpad)) * ih;

        let g = "";
        /* 异常周底色 */
        slots.forEach((sl, i) => {
          if (sl.anomaly)
            g += `<rect x="${padL + i * bw}" y="${padT}" width="${bw + 0.5}" height="${ih}" fill="var(--amber-soft)"/>`;
        });
        /* 左轴网格 */
        [-1, -0.5, 0, 0.5, 1].forEach((k) => {
          const v = (k * vmax) / 1.1;
          const y = yv(v);
          g += `<line x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}" stroke="${k === 0 ? "var(--line-strong)" : "var(--line)"}" ${k === 0 ? "" : 'stroke-dasharray="2 3"'}/>`;
          g += `<text class="axis" x="${padL - 8}" y="${y + 4}" text-anchor="end">${k === 0 ? "0" : sign(v).replace(".0", "")}</text>`;
        });
        /* 右轴指数 */
        [cmin, (cmin + cmax) / 2, cmax].forEach((c) => {
          g += `<text class="axis" x="${W - padR + 8}" y="${yc(c) + 4}">${c.toFixed(0)}</text>`;
        });
        /* 柱 */
        const gap = Math.min(2, bw * 0.25);
        slots.forEach((sl, i) => {
          const x = padL + i * bw + gap / 2;
          if (sl.pending) {
            g += `<rect x="${x}" y="${padT + 2}" width="${bw - gap}" height="${ih - 4}" fill="none" stroke="var(--amber)" stroke-dasharray="3 3" rx="2"/>`;
            return;
          }
          const y0 = yv(0),
            y1 = yv(sl.v);
          g += `<rect x="${x}" y="${Math.min(y0, y1)}" width="${Math.max(1, bw - gap)}" height="${Math.max(1, Math.abs(y1 - y0))}" fill="${sl.v >= 0 ? "var(--green)" : "var(--red)"}" opacity="${sl.anomaly ? 1 : 0.72}"/>`;
        });
        /* 指数线 */
        const pts = slots
          .map((sl, i) =>
            sl.pending
              ? null
              : `${(padL + i * bw + bw / 2).toFixed(1)},${yc(sl.close).toFixed(1)}`,
          )
          .filter(Boolean);
        g += `<polyline points="${pts.join(" ")}" fill="none" stroke="var(--text)" stroke-width="1.6" stroke-linejoin="round"/>`;
        /* 月份刻度 */
        let lastM = "";
        slots.forEach((sl, i) => {
          const m = sl.label.slice(0, 7);
          if (m !== lastM) {
            if (lastM)
              g += `<text class="axis" x="${padL + i * bw}" y="${H - 8}">${m.slice(2).replace("-", "/")}</text>`;
            lastM = m;
          }
        });
        /* 悬浮热区 */
        slots.forEach((sl, i) => {
          const head =
            state.gran === "day" ? sl.label : `${sl.label.slice(5)} 当周`;
          const html = sl.pending
            ? tipAttr(head, [
                ["状态", "尚未公布"],
                ["说明", "份额收盘清算后公布，次日早盘前可查"],
              ])
            : tipAttr(head, [
                [
                  state.gran === "day" ? "净申购" : "周累计净申购",
                  sign(sl.v) + " " + unitLabel(unit),
                ],
                [s.index + " 收盘", sl.close.toFixed(2)],
                [
                  "所在周 / 日均",
                  sl.weekMult.toFixed(1) + "×" + (sl.anomaly ? "（异常）" : ""),
                ],
              ]);
          g += `<rect x="${padL + i * bw}" y="${padT}" width="${bw}" height="${ih}" fill="transparent" data-tip="${html}"/>`;
        });
        $("main-chart").innerHTML = `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
        $("chart-title").textContent = `${s.name} · 净申购与 ${s.index}`;
        $("legend-index").textContent = `${s.index} 收盘（右轴）`;
        const bench = benchAt(s, unit, N - 1);
        $("chart-sub").textContent =
          `左轴 ${unitLabel(unit)}${unit === "amt" ? "（份额差 × 单位净值，估算）" : ""} · 近一年日均 |${bench.toFixed(1)}|`;
      };

      /* ================= 长线：总份额 ================= */

      const renderTrend = () => {
        const rows = state.trend === "all" ? TREND : TREND.slice(-60);
        const W = 640,
          H = 260,
          padL = 52,
          padR = 12,
          padT = 12,
          padB = 26;
        const iw = W - padL - padR,
          ih = H - padT - padB;
        const vs = rows.map((r) => r.v);
        const vmin = Math.min(...vs) * 0.9,
          vmax = Math.max(...vs) * 1.04;
        const x = (i) => padL + (i / (rows.length - 1)) * iw;
        const y = (v) => padT + (1 - (v - vmin) / (vmax - vmin)) * ih;
        let g = "";
        [0, 0.5, 1].forEach((k) => {
          const v = vmin + (vmax - vmin) * k;
          g += `<line x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="2 3"/>`;
          g += `<text class="axis" x="${padL - 8}" y="${y(v) + 4}" text-anchor="end">${(v / 10000).toFixed(2)}万</text>`;
        });
        rows.forEach((r, i) => {
          if (r.ym.endsWith("-01"))
            g += `<text class="axis" x="${x(i)}" y="${H - 8}" text-anchor="middle">${r.ym.slice(0, 4)}</text>`;
        });
        const line = rows
          .map(
            (r, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(r.v).toFixed(1)}`,
          )
          .join("");
        g += `<path d="${line} L${x(rows.length - 1)},${padT + ih} L${padL},${padT + ih} Z" fill="var(--green)" opacity="0.07"/>`;
        g += `<path d="${line}" fill="none" stroke="var(--green)" stroke-width="1.8"/>`;
        const last = rows[rows.length - 1];
        g += `<circle cx="${x(rows.length - 1)}" cy="${y(last.v)}" r="3.5" fill="var(--amber)" stroke="#fff" stroke-width="1.5"/>`;
        const cw = iw / rows.length;
        rows.forEach((r, i) => {
          const prev = rows[i - 1];
          const chg = prev ? sign(r.v - prev.v) + " 亿份" : "—";
          g += `<rect x="${x(i) - cw / 2}" y="${padT}" width="${cw}" height="${ih}" fill="transparent" data-tip="${tipAttr(
            r.ym,
            [
              ["月末总份额", r.v.toFixed(0) + " 亿份"],
              ["较上月", chg],
            ],
          )}"/>`;
        });
        $("trend-chart").innerHTML = `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
      };

      /* ================= 长线：月度分位 ================= */

      const MONTHLY = (() => {
        const out = {};
        Object.values(SERIES).forEach((s) => {
          const m = new Map();
          DAYS.forEach((d, i) =>
            m.set(d.slice(0, 7), (m.get(d.slice(0, 7)) || 0) + s.amt[i]),
          );
          out[s.key] = m;
        });
        return out;
      })();
      const COMPLETE_MONTHS = [...MONTHLY.hs300.keys()].filter(
        (m) => m < LAST_PUBLISHED.slice(0, 7),
      );

      const renderPct = () => {
        const ms = COMPLETE_MONTHS;
        const at = ms.indexOf(state.month);
        const win = ms.slice(at - 59, at + 1);
        $("pct-rows").innerHTML = [
          ...GROUPS.map((g) => SERIES[g.key]),
          SERIES.total,
        ]
          .map((s) => {
            const vals = win.map((m) => MONTHLY[s.key].get(m));
            const cur = MONTHLY[s.key].get(state.month);
            const pct =
              (vals.filter((v) => v <= cur).length / vals.length) * 100;
            const lo = Math.min(...vals),
              hi = Math.max(...vals);
            const W = 360,
              H = 34;
            const x = (v) => 6 + ((v - lo) / (hi - lo)) * (W - 12);
            let g = `<line x1="0" x2="${W}" y1="${H / 2}" y2="${H / 2}" stroke="var(--line)"/>`;
            if (lo < 0 && hi > 0)
              g += `<line x1="${x(0)}" x2="${x(0)}" y1="4" y2="${H - 4}" stroke="var(--line-strong)"/>`;
            win.forEach((m, k) => {
              const v = vals[k];
              if (m === state.month) return;
              g += `<circle cx="${x(v)}" cy="${H / 2}" r="3.2" fill="${v >= 0 ? "var(--green)" : "var(--red)"}" opacity="0.35" data-tip="${tipAttr(m, [["净申购", sign(v) + " 亿元"]])}"/>`;
            });
            g += `<line x1="${x(cur)}" x2="${x(cur)}" y1="2" y2="${H - 2}" stroke="var(--amber)" stroke-width="2.5" data-tip="${tipAttr(
              state.month + "（选中）",
              [
                ["净申购", sign(cur) + " 亿元"],
                ["五年分位", pct.toFixed(0)],
              ],
            )}"/>`;
            return `<div class="pct-row">
              <div class="pct-name">${s.name}${s.key === "total" ? "<small>背景</small>" : ""}</div>
              <svg viewBox="0 0 ${W} ${H}">${g}</svg>
              <div class="pct-val"><div class="p num">P${pct.toFixed(0)}</div><div class="v num ${dirCls(cur)}">${sign(cur)} 亿元</div></div>
            </div>`;
          })
          .join("");
      };

      const initMonthSelect = () => {
        const sel = $("month-select");
        sel.innerHTML = COMPLETE_MONTHS.slice(-24)
          .reverse()
          .map((m) => `<option value="${m}">${m}</option>`)
          .join("");
        state.month = sel.value;
        sel.addEventListener("change", () => {
          state.month = sel.value;
          renderPct();
        });
      };

      /* ================= 明细表 ================= */

      const COLS = [
        { key: "code", label: "代码", l: true },
        { key: "name", label: "名称", l: true },
        { key: "ex", label: "交易所", l: true },
        { key: "group", label: "跟踪指数", l: true },
        { key: "shares", label: "份额 亿份", sort: true },
        { key: "day", label: "当日变动 亿份", sort: true },
        { key: "week", label: "本周变动 亿份", sort: true },
        { key: "weekAmt", label: "本周净申购 ≈亿元", sort: true },
      ];
      const GROUP_NAME = Object.fromEntries(GROUPS.map((g) => [g.key, g.name]));

      const etfRow = (e) => {
        const nWeek = weekReading(SERIES[e.group], "shr").idxs.length;
        const week = e.dayShr.slice(-nWeek).reduce((a, b) => a + b, 0);
        return {
          ...e,
          day: e.dayShr[e.dayShr.length - 1],
          week,
          weekAmt: week * e.nav,
        };
      };

      const renderTable = () => {
        $("thead").innerHTML = COLS.map((c) => {
          const arrow =
            state.sortKey === c.key ? (state.sortDir < 0 ? "↓" : "↑") : "";
          return `<th class="${c.l ? "l" : ""} ${c.sort ? "sortable" : ""}" data-k="${c.key}">${c.label}<span class="arrow">${arrow}</span></th>`;
        }).join("");
        const pending = isPending();
        const q = state.q.trim().toLowerCase();
        const rows = ETFS.map(etfRow)
          .filter((r) => state.filter === "all" || r.group === state.filter)
          .filter(
            (r) => !q || r.code.includes(q) || r.name.toLowerCase().includes(q),
          )
          .sort(
            (a, b) => (a[state.sortKey] - b[state.sortKey]) * state.sortDir,
          );
        if (!rows.length) {
          $("tbody").innerHTML =
            `<tr><td colspan="${COLS.length}" class="empty">没有匹配的 ETF</td></tr>`;
          return;
        }
        const pend = '<td class="pending">尚未公布</td>';
        $("tbody").innerHTML = rows
          .map(
            (r) => `<tr>
              <td class="l num">${r.code}</td>
              <td class="l">${r.name}</td>
              <td class="l"><span class="ex">${r.ex === "SSE" ? "上交所" : "深交所"}</span></td>
              <td class="l">${SERIES[r.group].index}</td>
              <td class="num">${r.shares.toFixed(1)}${pending ? '<span class="dim caption-5"> · 11-06</span>' : ""}</td>
              ${pending ? pend + pend + pend : `<td class="num ${dirCls(r.day)}">${sign(r.day)}</td><td class="num ${dirCls(r.week)}">${sign(r.week)}</td><td class="num ${dirCls(r.weekAmt)}">${sign(r.weekAmt)}</td>`}
            </tr>`,
          )
          .join("");
      };

      const initTable = () => {
        const seg = $("seg-filter");
        seg.innerHTML = [["all", "全部"], ...GROUPS.map((g) => [g.key, g.name])]
          .map(
            ([v, t]) =>
              `<button data-v="${v}" class="${v === "all" ? "on" : ""}">${t}</button>`,
          )
          .join("");
        bindSeg("seg-filter", (v) => (state.filter = v), renderTable);
        $("search").addEventListener("input", (e) => {
          state.q = e.target.value;
          renderTable();
        });
        $("thead").addEventListener("click", (e) => {
          const th = e.target.closest("th.sortable");
          if (!th) return;
          const k = th.dataset.k;
          state.sortDir = state.sortKey === k ? -state.sortDir : -1;
          state.sortKey = k;
          renderTable();
        });
      };

      /* ================= 交互绑定 ================= */

      function bindSeg(id, set, rerender) {
        $(id).addEventListener("click", (e) => {
          const b = e.target.closest("button");
          if (!b || b.disabled) return;
          $(id)
            .querySelectorAll("button")
            .forEach((x) => x.classList.toggle("on", x === b));
          set(b.dataset.v);
          rerender();
        });
      }

      const renderChips = () => {
        const pending = isPending();
        const chip = (id, name, count) => {
          const el = $(id);
          el.className = "src-chip" + (pending ? " pending" : "");
          el.innerHTML = `<span class="dot"></span>${name} <b>${pending ? "尚未公布" : count + " 只"}</b>`;
          el.dataset.help = pending
            ? `${name} ${state.date} 份额尚未公布。份额收盘清算后公布，次日早盘前可查。`
            : `${name} ${state.date} 已公布 ${count} 只 ETF 份额。`;
        };
        chip("chip-sse", "上交所", 923);
        chip("chip-szse", "深交所", 772);
      };

      const renderAll = () => {
        $("th-val").textContent = state.threshold + "×";
        renderChips();
        renderKpis();
        renderMain();
        renderTable();
      };

      $("date-select").addEventListener("change", (e) => {
        state.date = e.target.value;
        renderAll();
      });
      $("th-minus").addEventListener("click", () => {
        state.threshold = Math.max(1, state.threshold - 1);
        renderAll();
      });
      $("th-plus").addEventListener("click", () => {
        state.threshold = Math.min(20, state.threshold + 1);
        renderAll();
      });
      bindSeg("seg-gran", (v) => (state.gran = v), renderMain);
      bindSeg("seg-range", (v) => (state.range = Number(v)), renderMain);
      bindSeg("seg-unit", (v) => (state.unit = v), renderMain);
      bindSeg("seg-trend", (v) => (state.trend = v), renderTrend);

      initMonthSelect();
      initTable();
      renderAll();
      renderTrend();
      renderPct();
    </script>
  </body>
</html>
