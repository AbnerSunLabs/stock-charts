<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>点位跟踪</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #f8fafc;
        --ink: #0f172a;
        --ink-soft: rgba(15, 23, 42, 0.78);
        --muted: rgba(15, 23, 42, 0.56);
        --rule: rgba(15, 23, 42, 0.16);
        --accent: #2563eb;
        --up: #0b7a56;
        --up: oklch(from #10b981 0.42 0.12 166);
        --down: #cf202f;
        --sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
        --serif: "Noto Serif SC", "Songti SC", "STSong", serif;
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 16px;
        line-height: 1.5;
      }

      body {
        text-wrap: pretty;
      }

      .page {
        width: min(1120px, calc(100% - 48px));
        margin: 0 auto;
        padding: 28px 0 72px;
      }

      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .crumb {
        display: flex;
        gap: 8px;
        margin: 0;
        color: var(--muted);
        font-size: 13px;
      }

      .indices {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 8px 32px;
        margin: 28px 0 0;
        padding: 0 0 12px;
        border-bottom: 1px solid var(--rule);
      }

      .indices button {
        margin: 0;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--muted);
        font-family: var(--sans);
        font-size: 15px;
        line-height: 1.2;
        cursor: pointer;
      }

      .indices button:hover {
        color: var(--ink);
      }

      .indices button:focus-visible,
      .speech a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
      }

      .indices button[aria-selected="true"] {
        color: var(--ink);
        font-family: var(--serif);
        font-size: 30px;
        font-weight: 600;
      }

      .stage {
        display: grid;
        grid-template-columns: minmax(0, 1.08fr) minmax(280px, 0.92fr);
        gap: 56px;
        align-items: start;
        margin-top: 36px;
      }

      .staff {
        position: relative;
        height: 560px;
      }

      .scale {
        position: absolute;
        inset: 0;
      }

      .spine {
        position: absolute;
        top: 8px;
        bottom: 8px;
        left: 0;
        width: 1px;
        background: var(--rule);
      }

      .mark {
        position: absolute;
        left: 0;
        display: flex;
        align-items: baseline;
        gap: 10px;
        max-width: 42%;
        transform: translateY(-50%);
      }

      .mark-tick {
        width: 14px;
        height: 1px;
        background: var(--rule);
        flex: none;
        align-self: center;
      }

      .mark-point,
      .mark-name {
        position: relative;
        z-index: 2;
        background: var(--paper);
      }

      .mark-point {
        font-size: 15px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.02em;
      }

      .mark-name {
        font-family: var(--serif);
        font-size: 15px;
        color: var(--muted);
      }

      .price-line,
      .now {
        position: absolute;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        transition: top 0.45s var(--ease);
      }

      .price-line {
        height: 1px;
        background: var(--ink);
        z-index: 1;
      }

      .now-cursor {
        position: absolute;
        left: -3px;
        top: 50%;
        width: 7px;
        height: 7px;
        background: var(--ink);
        transform: translateY(-50%);
      }

      .now {
        z-index: 2;
        left: 42%;
        width: max-content;
        max-width: 56%;
        padding: 0 10px;
        background: var(--paper);
      }

      .now-follow {
        position: absolute;
        top: calc(100% + 8px);
        left: 0;
        min-width: 100%;
        padding: 0 10px 2px;
        background: var(--paper);
      }

      .staff.is-instant .price-line,
      .staff.is-instant .now {
        transition: none;
      }

      .now-price {
        margin: 0;
        font-size: clamp(36px, 4vw, 48px);
        font-weight: 600;
        line-height: 0.95;
        letter-spacing: -0.045em;
        font-variant-numeric: tabular-nums;
      }

      .now-delta {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        line-height: 1.3;
      }

      .now-meta {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.3;
        font-variant-numeric: tabular-nums;
      }

      .now-meta .up {
        color: var(--up);
      }

      .now-meta .down {
        color: var(--down);
      }

      .ledger {
        max-height: 560px;
        overflow: auto;
        overscroll-behavior: contain;
      }

      .entry {
        padding: 20px 0;
        border-top: 1px solid var(--rule);
      }

      .entry:first-child {
        padding-top: 0;
        border-top: 0;
      }

      .entry time {
        display: block;
        color: var(--muted);
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }

      .speech + .speech {
        margin-top: 16px;
      }

      .speech h2 {
        margin: 6px 0 0;
        font-family: var(--serif);
        font-size: 18px;
        font-weight: 600;
        line-height: 1.35;
      }

      .speech p {
        margin: 8px 0 0;
        color: var(--ink-soft);
        font-size: 16px;
        line-height: 1.65;
      }

      .speech a {
        display: inline-block;
        margin-top: 10px;
        color: var(--accent);
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
      }

      .speech a:hover {
        text-decoration: underline;
      }

      .note {
        margin: 36px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      @media (max-width: 860px) {
        .page {
          width: min(100% - 32px, 1120px);
        }

        .stage {
          grid-template-columns: 1fr;
          gap: 32px;
        }

        .staff,
        .ledger {
          height: auto;
          max-height: none;
        }

        .staff {
          display: flex;
          flex-direction: column;
          gap: 20px;
        }

        .now {
          position: relative;
          left: auto;
          top: auto !important;
          max-width: none;
          transform: none;
          order: -1;
          padding: 0;
        }

        .now-follow {
          position: static;
          padding: 0;
        }

        .scale {
          position: relative;
          inset: auto;
          height: 360px;
        }

        .mark {
          max-width: 78%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .now {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <h1 class="sr">点位跟踪</h1>
      <nav class="crumb" aria-label="面包屑">
        <span>工具集</span>
        <span aria-hidden="true">/</span>
        <span aria-current="page">点位跟踪</span>
      </nav>
      <div class="indices" role="tablist" aria-label="指数"></div>
      <div class="stage">
        <section class="staff" aria-label="现价在判断点位中的位置">
          <div class="now">
            <p class="now-price"></p>
            <div class="now-follow">
              <p class="now-delta"></p>
              <p class="now-meta"></p>
            </div>
          </div>
          <div class="scale">
            <div class="spine"></div>
            <div class="price-line">
              <div class="now-cursor" aria-hidden="true"></div>
            </div>
          </div>
        </section>
        <div class="ledger" id="ledger"></div>
      </div>
      <p class="note">预览里的收盘是示意。正式页用库里的收盘。</p>
    </main>
    <script>
      const INDICES = [
        {
          name: "中证500",
          code: "000905",
          last: 6800.66,
          prev: 6754.2,
          asOf: "2026-10-19",
          levels: [
            { name: "外太空", point: 8500, label: "8,500" },
            { name: "钻石坑", point: 4800, label: "4,800" },
          ],
          quotes: [
            {
              date: "2026-10-20",
              level: "钻石坑 4800",
              postId: 92515,
              text: "2023年2月，我估算的中证500外太空点位是8100点。\n\n当时是6200点，后来最低跌到了4200点。\n\n2026年1月，中证500在2015年以后首次突破8100点。由于时间已经过了3年多，点位每年会有些许上浮，所以我又等了一等。\n\n再涨几百点后，我开始按照3年多前的预判果断减仓。\n\n知行合一。\n\n现在，中证500从最高9100点，跌回了6800点。\n\n今天，我再给一个钻石坑点位。如果能到，我会在那个附近把宽基仓位配置完毕。\n\n以今天的指数看，中证500在4800点左右，又是一个完美配置位置。不是说必然到，而是说到了的话，不要犹豫。\n\n注意，这个点位大概每年会增加200点，因为通胀及利润增长。\n\n不知道几年后才有机会见到？",
            },
            {
              date: "2026-01-21",
              level: "外太空 8500",
              postId: 63985,
              text: "500眼看就要阶段新高。\n\n未来会按照计划，在8500附近一线（外太空分界线）减持。\n\n但是减持力度会比之前预想的要弱一些，因为目前看行情还比较温柔。\n\n总之未来涨跌都有预案，等行情自己走就可以。",
            },
            {
              date: "2026-01-12",
              level: "外太空 8500/8600",
              postId: 61657,
              text: "我在5、6000点说，中证500外太空基本是8000多，8500/8600左右。\n\n有人说我画饼，骗人买指数基金。\n\n等我未来8500/8600多卖点，之后如果继续涨，又会有人说我卖飞了，赚不到大钱。\n\n甚至两波人可能是一波。\n\n其实大多数人，对于这个世界以及各种各样的事情，并没有一个理性的、客观的、不变的标准。他们看待事物，只有随波逐流，只有因时而异。牛市看涨，熊市看跌。\n\n我不想成为那样的人。\n\n所以，致敬点位我就买，外太空点位我就卖。所有点位都是几个月几年前明牌的。这就叫做——知行合一。\n\n我管你这那的呢。我赚到了钱，你得到了嘲笑我的机会。大家都有收获，多好。",
            },
          ],
        },
        {
          name: "中证红利低波动100",
          code: "930955",
          last: 11630.21,
          prev: 11588,
          asOf: "2026-10-19",
          levels: [
            { name: "第一支撑", point: 11200, label: "11,200–11,300" },
            { name: "第二支撑", point: 10500, label: "10,500–10,800" },
          ],
          quotes: [
            {
              date: "2025-12-18",
              level: "两档支撑",
              postId: 58345,
              text: "这几天多说了两句红利，是因为我们之前这车发的红利，所以多说了几句。\n\n有朋友问，红利哪里是低估呢。或者说，哪里可以多买点呢。\n\n未来如果大跌，计划肯定会多买。那如果计划不买，或者你想买更多，或者你已经没有跟计划了，那么我给你几个点位，你自己关注一下。\n\n我就用我们发车的红利100低波指数来说，其它的红利大差不差都是这个幅度。\n\n这个指数代码是930955。我们就用这个价格指数，不用全收益指数说。\n\n目前是11920点。\n\n在下面第一个比较大的支撑是11200-11300左右。距离目前跌幅大概是6.4%左右。\n\n再下面一个比较大的支撑大概是10500-10800左右。这个支撑更加扎实。距离目前跌幅12%左右。\n\n那你说是不是铁底，还会不会更低。经过去年恒生跌破30年铁底，你还相信有什么铁底么，我都不信了。\n\n但是，虽然不是绝对不会跌破的铁底，这两个位置应该是很不错的加仓位置。你可以看到时候计划买不买。\n\n至于说如果实质性跌破，下面还有没有支撑，从技术角度看意义不是很大了。如果碰上金融危机级别的调整，我想，极限就不好说了。25%？35%？再多我就不敢想了。\n\n注意，这两个区间是目前的点位。都会随着时间上移。每年上移4.5%左右。\n\n这么清晰的明牌不多见吧。",
            },
          ],
        },
        {
          name: "创业板R",
          code: "399606",
          last: 3061.17,
          prev: 3094.4,
          asOf: "2026-10-20",
          levels: [{ name: "压力测试", point: 2100, label: "2,100" }],
          quotes: [
            {
              date: "2026-10-16",
              level: "压力测试 2100",
              postId: 92155,
              text: "创业板的压力测试点位。\n\n我个人根据各方面资料综合估计，这次创业板的极限跌幅应该不会到7080，除非发生08年级别的危机。\n\n极限应该在最高点下跌60%左右，取整的话就是2100左右。随着时间推移，这个点位每年也会增加一些。\n\n我说的是创业板R（399606）\n\n不是说一定跌到，而是各位如果有布局计划，用这个点位作为压力测试以及布局策略规划位置，我觉得应该是比较合理以及足够保守的。",
            },
          ],
        },
      ];

      const tablist = document.querySelector(".indices");
      const staff = document.querySelector(".staff");
      const scale = document.querySelector(".scale");
      const now = document.querySelector(".now");
      const priceLine = document.querySelector(".price-line");
      const ledger = document.getElementById("ledger");
      let primed = false;

      function nearest(index) {
        return index.levels.reduce((best, level) => {
          const gap = Math.abs(index.last - level.point);
          if (!best || gap < best.gap) return { level, gap };
          return best;
        }, null).level;
      }

      function yOf(index) {
        const values = index.levels
          .map((level) => level.point)
          .concat(index.last);
        const max = Math.max.apply(null, values);
        const min = Math.min.apply(null, values);
        const span = Math.max(max - min, 1);
        const top = max + span * 0.22;
        const bottom = min - span * 0.22;
        return (value) => ((top - value) / (top - bottom)) * 100;
      }

      function groupQuotesByDate(quotes) {
        const sorted = quotes
          .slice()
          .sort((a, b) => b.date.localeCompare(a.date));
        const groups = [];
        sorted.forEach((quote) => {
          const current = groups[groups.length - 1];
          if (current && current.date === quote.date) {
            current.quotes.push(quote);
            return;
          }
          groups.push({ date: quote.date, quotes: [quote] });
        });
        return groups;
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function formatPrice(value) {
        return value.toLocaleString("zh-CN", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        });
      }

      function renderScale(item) {
        scale.querySelectorAll(".mark").forEach((node) => node.remove());
        const y = yOf(item);
        const level = nearest(item);
        const delta = item.last - level.point;
        const side = delta > 0 ? "高出" : delta < 0 ? "低于" : "贴着";
        const points = Math.abs(delta).toLocaleString("zh-CN", {
          maximumFractionDigits: 0,
        });
        const change = ((item.last - item.prev) / item.prev) * 100;
        const up = change >= 0;

        item.levels.forEach((mark) => {
          const row = document.createElement("div");
          row.className = "mark";
          row.style.top = y(mark.point) + "%";
          row.innerHTML =
            '<span class="mark-tick" aria-hidden="true"></span>' +
            '<span class="mark-point">' +
            escapeHtml(mark.label) +
            "</span>" +
            '<span class="mark-name">' +
            escapeHtml(mark.name) +
            "</span>";
          scale.insertBefore(row, priceLine);
        });

        if (!primed) staff.classList.add("is-instant");
        const top = y(item.last) + "%";
        now.style.top = top;
        priceLine.style.top = top;
        if (!primed) {
          requestAnimationFrame(() => {
            staff.classList.remove("is-instant");
            primed = true;
          });
        }

        now.querySelector(".now-price").textContent = formatPrice(item.last);
        now.querySelector(".now-delta").textContent =
          side + level.name + " " + points + " 点";
        now.querySelector(".now-meta").innerHTML =
          escapeHtml(item.asOf) +
          " 收盘 " +
          '<span class="' +
          (up ? "up" : "down") +
          '">' +
          (up ? "+" : "") +
          change.toFixed(2) +
          "%</span>";
      }

      function renderLedger(item) {
        const groups = groupQuotesByDate(item.quotes);
        ledger.innerHTML = groups
          .map((group) => {
            const speeches = group.quotes
              .map(
                (quote) =>
                  '<div class="speech"><p>' +
                  escapeHtml(quote.text) +
                  '</p><a href="https://qieman.com/content/content-detail?postId=' +
                  encodeURIComponent(quote.postId) +
                  '" target="_blank" rel="noopener noreferrer">查看原文</a></div>',
              )
              .join("");
            return (
              '<article class="entry"><time datetime="' +
              escapeHtml(group.date) +
              '">' +
              escapeHtml(group.date) +
              "</time>" +
              speeches +
              "</article>"
            );
          })
          .join("");
        ledger.querySelectorAll("p").forEach(clampTwoLines);
      }

      function clampTwoLines(node) {
        const text = node.textContent.replace(/\s+/g, " ").trim();
        const maxHeight = parseFloat(getComputedStyle(node).lineHeight) * 2 + 1;
        const fits = (value) => {
          node.textContent = value;
          return node.scrollHeight <= maxHeight;
        };
        if (fits(text)) return;
        let low = 0;
        let high = text.length;
        while (low < high) {
          const mid = Math.ceil((low + high) / 2);
          const candidate = text.slice(0, mid).trimEnd() + "...";
          if (fits(candidate)) low = mid;
          else high = mid - 1;
        }
        node.textContent = text.slice(0, low).trimEnd() + "...";
      }

      function select(code) {
        const item = INDICES.find((row) => row.code === code) || INDICES[0];
        tablist.querySelectorAll('[role="tab"]').forEach((button) => {
          const on = button.dataset.code === item.code;
          button.setAttribute("aria-selected", on ? "true" : "false");
          button.tabIndex = on ? 0 : -1;
        });
        renderScale(item);
        renderLedger(item);
      }

      function buildTabs() {
        INDICES.forEach((item, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.role = "tab";
          button.dataset.code = item.code;
          button.id = "tab-" + item.code;
          button.textContent = item.name;
          button.setAttribute("aria-selected", index === 0 ? "true" : "false");
          button.tabIndex = index === 0 ? 0 : -1;
          button.addEventListener("click", () => select(item.code));
          tablist.appendChild(button);
        });
      }

      tablist.addEventListener("keydown", (event) => {
        const keys = ["ArrowRight", "ArrowLeft", "Home", "End"];
        if (!keys.includes(event.key)) return;
        const buttons = Array.from(tablist.querySelectorAll('[role="tab"]'));
        const current = buttons.findIndex(
          (button) => button.getAttribute("aria-selected") === "true",
        );
        let next = current;
        if (event.key === "ArrowRight") next = (current + 1) % buttons.length;
        if (event.key === "ArrowLeft")
          next = (current - 1 + buttons.length) % buttons.length;
        if (event.key === "Home") next = 0;
        if (event.key === "End") next = buttons.length - 1;
        event.preventDefault();
        buttons[next].focus();
        select(buttons[next].dataset.code);
      });

      buildTabs();
      select(INDICES[0].code);
    </script>
  </body>
</html>
