<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>组合看板 · 自适应预览</title>
  <link rel="icon" href="data:,">
  <style>
    :root { --ink:#0a0b0d; --muted:#5b616e; --border:#dee1e6; --blue:#0052ff; --loss:#cf202f; --profit:#05b169; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:#fff; font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    button,input,select { font:inherit; }
    button,select { cursor:pointer; }
    button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible { outline:2px solid var(--blue); outline-offset:3px; }
    .demo-tools { display:flex; flex-wrap:wrap; align-items:center; gap:10px 20px; padding:12px 24px; background:#f7f7f7; border-bottom:1px solid var(--border); font-size:12px; color:var(--muted); }
    .demo-tools strong { color:var(--ink); }
    .demo-tools label { display:flex; align-items:center; gap:8px; }
    .demo-tools input { accent-color:var(--blue); }
    #viewport-info { margin-left:auto; font-variant-numeric:tabular-nums; }
    .view-main { padding:24px 16px; }
    .breadcrumb { color:var(--muted); font-size:13px; margin-bottom:12px; }
    .shell { max-width:1440px; margin:auto; padding:24px 12px; }
    .page-head { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:start; gap:20px; margin-bottom:28px; }
    h1 { margin:0; font-size:30px; font-weight:600; letter-spacing:-.02em; }
    .lead { margin:8px 0 0; color:var(--muted); }
    .actions { display:flex; flex-wrap:wrap; gap:8px; }
    .btn { border:1px solid var(--border); border-radius:999px; min-height:34px; padding:4px 16px; background:#fff; color:var(--ink); }
    .btn:hover { border-color:var(--blue); color:var(--blue); }
    .btn.primary { background:var(--blue); border-color:var(--blue); color:#fff; }
    .tabs { display:flex; gap:28px; border-bottom:1px solid var(--border); margin-bottom:20px; }
    .tab { padding:10px 0 12px; color:var(--muted); }
    .tab.active { border-bottom:2px solid var(--blue); color:var(--blue); }
    .board { display:grid; gap:20px; container-type:inline-size; }
    .summary { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    .summary-item { min-width:0; border:1px solid var(--border); border-radius:24px; padding:16px; box-shadow:0 4px 12px #0a0b0d0a; }
    .summary-item small { color:var(--muted); font-size:12px; }
    .summary-item b { display:block; margin-top:8px; font:600 20px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; letter-spacing:-.03em; overflow-wrap:anywhere; }
    .loss { color:var(--loss); }
    .profit { color:var(--profit); }
    .toolbar { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; }
    .toolbar-caption { display:flex; gap:12px; color:var(--muted); font-size:12px; }
    a { color:var(--blue); text-decoration:none; }
    a:hover { text-decoration:underline; }
    .filters { display:flex; flex-wrap:wrap; gap:8px; }
    select,input[type=search] { min-width:0; height:34px; padding:0 12px; border:1px solid var(--border); border-radius:8px; background:white; color:var(--ink); }
    select { width:160px; }
    input[type=search] { width:200px; }
    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr)); align-items:stretch; gap:20px; }
    .card { min-width:0; display:flex; flex-direction:column; border:1px solid var(--border); border-radius:24px; background:#fff; box-shadow:0 4px 12px #0a0b0d0a; }
    .card-head { padding:16px 24px; min-height:57px; display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; border-bottom:1px solid var(--border); }
    .title { flex:1 1 200px; display:flex; align-items:center; min-width:0; gap:6px; }
    h2 { min-width:0; margin:0; font-size:16px; font-weight:600; overflow-wrap:anywhere; }
    .symbol { font:400 14px ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--muted); white-space:nowrap; }
    .edit { flex-shrink:0; border:0; background:none; color:var(--muted); font-size:18px; padding:0 4px; }
    .tag { display:inline-block; max-width:100%; border:1px solid #91caff; border-radius:4px; color:#0958d9; background:#e6f4ff; padding:0 7px; font-size:12px; }
    .status { white-space:nowrap; }
    .card-body { flex:1; display:flex; flex-direction:column; gap:12px; padding:20px 24px 24px; min-width:0; }
    .note { min-height:22px; }
    .note .tag { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; vertical-align:top; }
    .quotes { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
    .quote { min-width:0; padding:10px 10px 12px; border:1px solid var(--border); border-radius:12px; }
    .quote small { display:block; color:var(--muted); font-size:11px; }
    .quote b { display:block; margin-top:4px; font:650 16px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:-.03em; overflow-wrap:anywhere; }
    .quote .sub { margin-top:2px; font:11px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--muted); overflow-wrap:anywhere; }
    .metrics { margin-bottom:4px; }
    .metric { display:flex; flex-wrap:wrap; justify-content:space-between; gap:4px 12px; padding:7px 0; font-size:13px; }
    .metric + .metric { border-top:1px dashed var(--border); }
    .metric span { color:var(--muted); }
    .metric b { font:400 13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; overflow-wrap:anywhere; }
    .card-body .actions { margin-top:auto; }
    .empty { grid-column:1/-1; text-align:center; padding:64px 16px; color:var(--muted); }
    dialog { width:min(440px,calc(100% - 32px)); padding:24px; border:1px solid var(--border); border-radius:20px; }
    dialog::backdrop { background:#0a0b0d55; }
    dialog h2 { margin-bottom:12px; }
    dialog p { color:var(--muted); }
    dialog .actions { justify-content:flex-end; margin-top:20px; }
    .demo-footer { color:var(--muted); font-size:12px; margin-top:24px; }
    @container (min-width:600px) { .summary { grid-template-columns:repeat(3,minmax(0,1fr)); } }
    @container (min-width:900px) { .summary { grid-template-columns:repeat(5,minmax(0,1fr)); } }
    @container (max-width:440px) { .filters { width:100%; } .filters select { flex:1 1 140px; } .filters input { flex:1 1 160px; width:100%; } .card-head { padding:16px; } .card-body { padding:16px; } }
    @media(min-width:640px) { .view-main { padding:32px 24px; } .shell { padding-top:32px; } }
    @media(min-width:1024px) { .view-main { padding-inline:40px; } .shell { padding-inline:20px; } }
    @media(min-width:1280px) { .shell { max-width:1600px; } }
    @media(min-width:1536px) { .view-main { padding-inline:48px; } .shell { max-width:1840px; } }
    @media(min-width:1920px) { .shell { max-width:2048px; } }
    @media(min-width:2560px) { .shell { max-width:2400px; } }
    @media(max-width:359px) { .quotes { grid-template-columns:1fr; } .quote { display:grid; grid-template-columns:1fr 1fr; gap:4px; } .quote .sub { grid-column:2; } h1 { font-size:26px; } }
    /* 对照模式保留现有布局的断点与不换行标题。 */
    .original .cards { grid-template-columns:minmax(0,1fr); gap:16px; }
    .original .card-head { flex-wrap:nowrap; gap:8px; }
    .original .title { flex:1; }
    .original h2 { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    @media(min-width:768px) { .original .cards { grid-template-columns:repeat(2,minmax(0,1fr)); } .original .summary { grid-template-columns:repeat(5,minmax(0,1fr)); } }
    @media(min-width:1280px) { .original .cards { grid-template-columns:repeat(3,minmax(0,1fr)); } }
    @media(min-width:1536px) { .original .cards { grid-template-columns:repeat(4,minmax(0,1fr)); } }
  </style>
</head>
<body>
  <aside class="demo-tools" aria-label="预览控制">
    <strong>组合看板 · 自适应预览</strong>
    <label><input id="compare" type="checkbox"> 对照原列数与标题布局</label>
    <span id="viewport-info" aria-live="polite"></span>
  </aside>
  <main class="view-main">
    <div class="breadcrumb">首页 / 网格交易策略</div>
    <div class="shell">
      <header class="page-head">
        <div><h1>网格交易策略</h1><p class="lead">配置价格边界与弹药，生成档位并查看资金压力与收益推演</p></div>
        <div class="actions"><button class="btn primary" data-action="创建网格策略">创建网格策略</button><button class="btn" data-action="我的策略">我的策略</button></div>
      </header>
      <nav class="tabs" aria-label="页面导航"><span class="tab active" aria-current="page">组合看板</span><a class="tab" href="#" data-action="计算器">计算器</a><a class="tab" href="#" data-action="流水">流水</a></nav>
      <section class="board" aria-label="组合看板">
        <div class="summary" id="summary"></div>
        <div class="toolbar">
          <span class="toolbar-caption">按策略平铺 <a href="https://ashare.laoqianriritan.com/#panel-valuation" target="_blank" rel="noopener noreferrer">宽基估值</a></span>
          <div class="filters"><select id="sort" aria-label="排序"><option value="loss">预计最大亏损</option><option value="occupied">已投入金额</option></select><input id="search" type="search" placeholder="搜索标的..." aria-label="搜索标的"></div>
        </div>
        <div class="cards" id="cards"></div>
      </section>
      <p class="demo-footer">预览使用演示数据。可缩放窗口、搜索标的或切换排序，查看布局变化；计算器、流水与编辑仅演示操作反馈。</p>
    </div>
  </main>
  <dialog id="feedback" aria-labelledby="feedback-title"><h2 id="feedback-title"></h2><p>当前是布局预览，使用演示数据。此操作将在正式页面中沿用原有功能。</p><div class="actions"><button class="btn primary" id="close-dialog">关闭</button></div></dialog>
  <script>
    const strategies = [
      { name:'沪深 300 网格', symbol:'510300', note:'宽基底仓，分批买入', open:4, total:15, rounds:3, close:'4.682', buy:'再跌 2.4%', buyPrice:'4.570', sell:'再涨 1.5%', sellPrice:'4.750', loss:28460, occupied:58640, profit:1268.50 },
      { name:'中证 500 网格', symbol:'510500', note:'', open:3, total:18, rounds:2, close:'6.080', buy:'再跌 2.0%', buyPrice:'5.960', sell:'再涨 3.3%', sellPrice:'6.280', loss:24680, occupied:36480, profit:824 },
      { name:'中证红利低波动长期网格策略', symbol:'512890', note:'长期配置，保留充足备用资金，等待下一档买入机会', open:5, total:20, rounds:6, close:'1.128', buy:'再跌 2.7%', buyPrice:'1.098', sell:'再涨 2.1%', sellPrice:'1.152', loss:18240, occupied:24560, profit:1560.80 },
      { name:'创业板 ETF 网格', symbol:'159915', note:'波动较大，控制仓位', open:2, total:16, rounds:1, close:'2.156', buy:'再跌 3.1%', buyPrice:'2.090', sell:'再涨 3.0%', sellPrice:'2.220', loss:16800, occupied:12936, profit:-186.20 },
      { name:'科创 50 网格', symbol:'588000', note:'', open:0, total:15, rounds:0, close:'1.052', buy:'再跌 2.1%', buyPrice:'1.030', sell:'—', sellPrice:'', loss:12500, occupied:0, profit:0 },
      { name:'证券 ETF 网格', symbol:'512880', note:'跟随计划执行', open:3, total:18, rounds:4, close:'0.986', buy:'再跌 1.6%', buyPrice:'0.970', sell:'再涨 2.4%', sellPrice:'1.010', loss:9860, occupied:15776, profit:642 }
    ];
    const money = value => value.toLocaleString('zh-CN',{minimumFractionDigits:0,maximumFractionDigits:2});
    const sum = key => strategies.reduce((total,item) => total + item[key],0);
    const summaries = [['预计最大投入',money(480000),''],['预计最大亏损',money(sum('loss')),'loss'],['组合跌幅%',(sum('loss')/480000*100).toFixed(1)+'%','loss'],['已实现收益','+'+money(sum('profit')),'profit'],['买入成本价',money(sum('occupied')),'']];
    document.querySelector('#summary').innerHTML = summaries.map(([label,value,tone]) => `<div class="summary-item"><small>${label}</small><b class="${tone}">${value}</b></div>`).join('');
    const cardList = document.querySelector('#cards');
    function render() {
      const query = document.querySelector('#search').value.trim().toLowerCase();
      const key = document.querySelector('#sort').value;
      const visible = strategies.filter(item => (item.name+item.symbol).toLowerCase().includes(query)).sort((a,b) => b[key]-a[key]);
      cardList.innerHTML = visible.map(item => `<article class="card">
        <header class="card-head"><div class="title"><h2>${item.name} <span class="symbol">${item.symbol}</span></h2><button class="edit" aria-label="编辑${item.name}" data-action="编辑 · ${item.name}">✎</button></div><span class="tag status">持仓中 ${item.open}/${item.total}，累计 ${item.rounds} 轮</span></header>
        <div class="card-body"><div class="note">${item.note ? `<span class="tag" title="${item.note}">${item.note}</span>` : ''}</div>
          <div class="quotes"><div class="quote"><small>收盘 11/12</small><b>${item.close}</b></div><div class="quote"><small>下一买</small><b class="loss">${item.buy}</b><div class="sub">${item.buyPrice}</div></div><div class="quote"><small>下一卖</small><b class="${item.sell==='—'?'':'profit'}">${item.sell}</b><div class="sub">${item.sellPrice}</div></div></div>
          <div class="metrics"><div class="metric"><span>预计最大亏损</span><b class="loss">${money(item.loss)}</b></div><div class="metric"><span>已投入金额</span><b>${money(item.occupied)}</b></div><div class="metric"><span>已实现收益</span><b class="${item.profit>0?'profit':item.profit<0?'loss':''}">${item.profit>0?'+':''}${money(item.profit)}</b></div></div>
          <div class="actions"><button class="btn primary" data-action="打开计算器 · ${item.name}">打开计算器</button><button class="btn" data-action="流水 · ${item.name}">流水</button></div>
        </div></article>`).join('') || '<div class="empty">暂无匹配策略</div>';
      updateInfo();
    }
    function updateInfo() {
      const columns = getComputedStyle(cardList).gridTemplateColumns.split(' ').length;
      document.querySelector('#viewport-info').textContent = `窗口 ${innerWidth}px · 看板 ${Math.round(cardList.clientWidth)}px · ${columns} 列`;
    }
    document.querySelector('#search').addEventListener('input',render);
    document.querySelector('#sort').addEventListener('change',render);
    document.querySelector('#compare').addEventListener('change',event => { document.body.classList.toggle('original',event.target.checked); updateInfo(); });
    new ResizeObserver(updateInfo).observe(cardList);
    const dialog = document.querySelector('#feedback');
    document.addEventListener('click',event => { const action=event.target.closest('[data-action]'); if(action) { event.preventDefault(); document.querySelector('#feedback-title').textContent=action.dataset.action; dialog.showModal(); } });
    document.querySelector('#close-dialog').addEventListener('click',() => dialog.close());
    render();
  </script>
</body>
</html>
