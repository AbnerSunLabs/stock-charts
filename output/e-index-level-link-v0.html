    <style>
      :root {
        --paper: #ffffff;
        --ink: #0f172a;
        --ink-soft: rgba(15, 23, 42, 0.72);
        --muted: rgba(15, 23, 42, 0.52);
        --accent: #2563eb;
        --up: #0b7a56;
        --down: #cf202f;
        --track: #e7eef6;
        --line: rgba(15, 23, 42, 0.12);
        --sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
        --serif: "Noto Serif SC", "Songti SC", serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 16px;
        line-height: 1.5;
      }

      .page {
        width: min(1120px, calc(100% - 48px));
        margin: 32px auto 64px;
      }

      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .crumb {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 28px;
        color: var(--muted);
        font-size: 14px;
      }

      .crumb a {
        color: var(--muted);
        text-decoration: none;
      }

      .crumb a:hover {
        color: var(--accent);
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 13px;
        color: var(--muted);
      }

      select {
        width: min(360px, 100%);
        height: 40px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        color: var(--ink);
        font: inherit;
      }

      .stage {
        display: grid;
        grid-template-columns: minmax(0, 1.08fr) minmax(280px, 0.92fr);
        gap: 56px;
        align-items: start;
        margin-top: 28px;
      }

      .ledger {
        max-height: 560px;
        overflow: auto;
      }

      .entry {
        padding: 20px 0;
        border-top: 1px solid var(--line);
      }

      .entry:first-child {
        padding-top: 0;
        border-top: 0;
      }

      .entry time {
        display: block;
        color: var(--muted);
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }

      .entry p {
        display: -webkit-box;
        margin: 8px 0 0;
        overflow: hidden;
        color: var(--ink-soft);
        font-size: 16px;
        line-height: 1.65;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .entry a {
        display: inline-block;
        margin-top: 10px;
        color: var(--accent);
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
      }

      .entry a:hover {
        text-decoration: underline;
      }

      .staff svg {
        width: min(520px, 100%);
        height: auto;
        display: block;
      }

      .face {
        filter: drop-shadow(0 12px 18px rgba(15, 23, 42, 0.08));
      }
      .track {
        fill: none;
        stroke: var(--track);
        stroke-width: 16;
        stroke-linecap: round;
      }
      .gap {
        fill: none;
        stroke: var(--accent);
        stroke-width: 16;
        stroke-linecap: round;
      }
      .tick {
        stroke: rgba(71, 85, 105, 0.35);
        stroke-width: 1.4;
      }
      .tick.major {
        stroke: rgba(51, 65, 85, 0.62);
        stroke-width: 2;
      }
      .tick.named {
        stroke: var(--ink);
        stroke-width: 2.4;
      }
      .num {
        fill: var(--muted);
        font-size: 12px;
        font-family: var(--sans);
      }
      .mark {
        fill: var(--ink);
        font-size: 13px;
        font-weight: 600;
        font-family: var(--sans);
      }
      .mark-name {
        fill: var(--muted);
        font-size: 13px;
        font-weight: 600;
        font-family: var(--serif);
      }
      .price {
        fill: var(--ink);
        font-size: 36px;
        font-weight: 600;
        font-family: var(--sans);
        letter-spacing: -0.04em;
      }
      .delta,
      .meta {
        fill: var(--muted);
        font-size: 13px;
        font-family: var(--sans);
      }
      .up {
        fill: var(--up);
      }
      .down {
        fill: var(--down);
      }
      .needle {
        fill: url(#needle-fill);
        stroke: rgba(148, 163, 184, 0.7);
        stroke-width: 1;
      }
      .hub {
        fill: #fff;
        stroke: var(--accent);
        stroke-width: 2;
      }

      .funds {
        margin-top: 8px;
      }

      .funds h2 {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 500;
      }

      .fund {
        display: flex;
        gap: 16px;
        align-items: baseline;
        justify-content: space-between;
        padding: 12px 0;
        border-top: 1px solid var(--line);
      }

      .fund b {
        display: block;
        font-weight: 600;
      }

      .fund span {
        color: var(--muted);
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }

      .fund button,
      .card button {
        padding: 0;
        border: 0;
        background: none;
        color: var(--accent);
        font: inherit;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
      }

      .fund button:hover,
      .card button:hover {
        text-decoration: underline;
      }

      .fund em,
      .card em {
        color: var(--muted);
        font-size: 13px;
        font-style: normal;
      }

      .empty-funds {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }

      .board {
        display: grid;
        gap: 0;
        margin-top: 8px;
      }

      .card {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px 24px;
        align-items: center;
        padding: 18px 0;
        border-top: 1px solid var(--line);
      }

      .card strong {
        font-weight: 600;
      }

      .card p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .card.is-target {
        background: rgba(37, 99, 235, 0.08);
        margin: 0 -12px;
        padding-left: 12px;
        padding-right: 12px;
      }

      @media (max-width: 760px) {
        .stage {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

      );
      draw(opened >= 0 ? opened : 0);
      if (opened >= 0) pick.value = String(opened);

      function draw(index) {
        const item = watches[index];
        const points = item.levels.map((level) => level.point);
        if (item.close != null) points.push(item.close);
        const span = Math.max(Math.max(...points) - Math.min(...points), 1);
        const top = Math.max(...points) + span * 0.16;
        const bottom = Math.min(...points) - span * 0.16;
        const step = majorStep(top - bottom);
        const deg = (value) =>
          START + ((value - bottom) / (top - bottom)) * SWEEP;

        const svg = svgEl("svg", { viewBox: "0 0 500 420", role: "img" });
        const defs = svgEl("defs", {});
        const fill = svgEl("linearGradient", {
          id: "needle-fill",
          x1: "0",
          y1: "0",
          x2: "0",
          y2: "1",
        });
        fill.append(svgEl("stop", { offset: "0", "stop-color": "#ffffff" }));
        fill.append(svgEl("stop", { offset: "1", "stop-color": "#d7e3f0" }));
        const faceFill = svgEl("linearGradient", {
          id: "face-fill",
          x1: "0",
          y1: "0",
          x2: "1",
          y2: "1",
        });
        faceFill.append(
          svgEl("stop", { offset: "0", "stop-color": "#ffffff" }),
        );
        faceFill.append(
          svgEl("stop", { offset: "0.6", "stop-color": "#f5f9fd" }),
        );
        faceFill.append(
          svgEl("stop", { offset: "1", "stop-color": "#e4edf6" }),
        );
        defs.append(fill, faceFill);
        svg.append(defs);

        svg.append(
          svgEl("circle", {
            class: "face",
            cx: CX,
            cy: CY,
            r: 178,
            fill: "url(#face-fill)",
            stroke: "#d5e2ef",
          }),
        );
        svg.append(
          svgEl("path", { class: "track", d: arc(R, START, START + SWEEP) }),
        );
        if (item.close != null) {
          const gapStart = START;
          const gapEnd = deg(item.close);
          svg.append(
            svgEl("path", { class: "gap", d: arc(R, gapStart, gapEnd) }),
          );
        }

        for (
          let value = Math.ceil(bottom / (step / 5)) * (step / 5);
          value <= top;
          value += step / 5
        ) {
          const onMajor =
            Math.abs(value / step - Math.round(value / step)) < 1e-6;
          if (
            item.levels.some(
              (level) => Math.abs(level.point - value) < step * 0.08,
            )
          )
            continue;
          const angle = deg(value);
          const inner = onMajor ? R - 8 : R - 2;
          const outer = onMajor ? R + 14 : R + 7;
          const a = polar(inner, angle);
          const b = polar(outer, angle);
          svg.append(
            svgEl("line", {
              class: onMajor ? "tick major" : "tick",
              x1: a[0],
              y1: a[1],
              x2: b[0],
              y2: b[1],
            }),
          );
          if (!onMajor) continue;
          if (
            nearAny(value, item.levels, step) ||
            (item.close != null && Math.abs(value - item.close) < step * 0.35)
          )
            continue;
          const spot = polar(FACE + 14, angle);
          const num = svgEl("text", {
            class: "num",
            x: spot[0],
            y: spot[1],
            "text-anchor": anchor(angle),
            "dominant-baseline": "middle",
          });
          num.textContent = formatTick(value);
          svg.append(num);
        }

        item.levels.forEach((level) => {
          const angle = deg(level.point);
          const a = polar(R - 8, angle);
          const b = polar(R + 18, angle);
          svg.append(
            svgEl("line", {
              class: "tick named",
              x1: a[0],
              y1: a[1],
              x2: b[0],
              y2: b[1],
            }),
          );
          const spot = polar(FACE + 22, angle);
          const text = svgEl("text", {
            class: "rim",
            x: spot[0],
            y: spot[1],
            "text-anchor": anchor(angle),
            "dominant-baseline": "middle",
          });
          const point = svgEl("tspan", {
            class: "mark",
            x: spot[0],
            dy: "-0.55em",
          });
          point.textContent = level.label.replace(/\d+/g, (digits) =>
            Number(digits).toLocaleString("zh-CN"),
          );
          const name = svgEl("tspan", {
            class: "mark-name",
            x: spot[0],
            dy: "1.25em",
          });
          name.textContent = level.name;
          text.append(point, name);
          svg.append(text);
        });

        if (item.close != null) {
          const tip = polar(R - 24, deg(item.close));
          const left = polar(11, deg(item.close) + 96);
          const right = polar(11, deg(item.close) - 96);
          const tail = polar(16, deg(item.close) + 180);
          svg.append(
            svgEl("polygon", {
              class: "needle",
              points: [tip, right, tail, left]
                .map((p) => p.map((n) => n.toFixed(1)).join(","))
                .join(" "),
            }),
          );
          svg.append(svgEl("circle", { class: "hub", cx: CX, cy: CY, r: 8 }));
          const price = svgEl("text", {
            class: "price",
            x: CX,
            y: CY + 58,
            "text-anchor": "middle",
          });
          price.textContent = formatClose(item.close);
          const delta = svgEl("text", {
            class: "delta",
            x: CX,
            y: CY + 82,
            "text-anchor": "middle",
          });
          delta.textContent = gapPhrase(item);
          const meta = svgEl("text", {
            class: "meta",
            x: CX,
            y: CY + 102,
            "text-anchor": "middle",
          });
          meta.append(document.createTextNode(item.date + " 收盘"));
          if (item.change != null) {
            const change = svgEl("tspan", {
              class: item.change >= 0 ? "up" : "down",
            });
            change.textContent =
              " " +
              (item.change >= 0 ? "+" : "") +
              item.change.toFixed(2) +
              "%";
            meta.append(change);
          }
          svg.append(price, delta, meta);
        } else {
          const missing = svgEl("text", {
            class: "delta",
            x: CX,
            y: CY + 64,
            "text-anchor": "middle",
          });
          missing.textContent = "暂无收盘";
          svg.append(missing);
        }
        staff.replaceChildren(svg);
        separateLabels(svg);
        renderLedger(item);
        renderFunds(item);
      }

      function renderLedger(item) {
        const quotes = item.quotes
          .slice()
          .sort((a, b) => (a.date < b.date ? 1 : -1));
        ledger.replaceChildren(
          ...quotes.map((quote) => {
            const entry = el("article", "entry");
            const time = el("time", "", quote.date);
            time.dateTime = quote.date;
            const text = el("p", "", quote.text.replace(/\s*\n+\s*/g, " "));
            const link = el("a", "", "查看原文");
            link.href =
              quote.url ||
              "https://qieman.com/content/content-detail?postId=" +
                quote.postId;
            link.target = "_blank";
            link.rel = "noreferrer";
            entry.append(time, text, link);
            return entry;
          }),
        );
      }

      function renderFunds(item) {
        const rows = funds.filter((fund) => fund.index === item.code);
        const title = el("h2", "", "跟踪这只指数的 ETF");
        if (rows.length === 0) {
          fundsBox.replaceChildren(
            title,
            el("p", "empty-funds", "池子里还没有跟踪这只指数的 ETF"),
          );
          return;
        }
        fundsBox.replaceChildren(
          title,
          ...rows.map((fund) => {
            const row = el("div", "fund");
            const name = document.createElement("div");
            name.append(el("b", "", fund.name), el("span", "", fund.code));
            row.append(name);
            if (fund.strategy) {
              const link = el("button", "", "组合看板");
              link.type = "button";
              link.addEventListener("click", () => showBoard(fund.code));
              row.append(link);
            } else {
              row.append(el("em", "", "未纳入组合"));
            }
            return row;
          }),
        );
      }

      function showBoard(code) {
        const back = el("button", "", "返回点位跟踪");
        back.type = "button";
        back.addEventListener("click", () => showIndex(null));
        boardBox.replaceChildren(
          back,
          ...board.map((item) => {
            const card = el(
              "article",
              item.code === code ? "card is-target" : "card",
            );
            const copy = document.createElement("div");
            copy.append(el("strong", "", item.strategy));
            const meta = el("p", "", item.code + " · 跟踪 " + item.indexName);
            copy.append(meta);
            card.append(copy);
            if (item.index) {
              const link = el("button", "", "点位跟踪");
              link.type = "button";
              link.addEventListener("click", () => showIndex(item.index));
              card.append(link);
            } else {
              card.append(el("em", "", "不在点位跟踪里"));
            }
            return card;
          }),
        );
        indexPage.hidden = true;
        boardPage.hidden = false;
        window.scrollTo(0, 0);
      }

      function showIndex(code) {
        boardPage.hidden = true;
        indexPage.hidden = false;
        if (code) {
          const index = watches.findIndex((item) => item.code === code);
          if (index >= 0) {
            pick.value = String(index);
            draw(index);
          }
        }
        window.scrollTo(0, 0);
      }

      function separateLabels(svg) {
        const gap = 6;
        svg.querySelectorAll("text.num, text.rim").forEach((node) => {
          for (let pass = 0; pass < 4; pass += 1) {
            const box = node.getBBox();
            const qx = Math.max(box.x, Math.min(CX, box.x + box.width));
            const qy = Math.max(box.y, Math.min(CY, box.y + box.height));
            let dx = qx - CX;
            let dy = qy - CY;
            let dist = Math.hypot(dx, dy);
            if (dist < 1) {
              dx = Number(node.getAttribute("x")) - CX;
              dy = Number(node.getAttribute("y")) - CY;
              dist = Math.hypot(dx, dy) || 1;
            }
            if (dist >= FACE + gap) break;
            shiftText(
              node,
              (dx / dist) * (FACE + gap - dist),
              (dy / dist) * (FACE + gap - dist),
            );
          }
        });
        let minX = CX - FACE - 20;
        let minY = CY - FACE - 20;
        let maxX = CX + FACE + 20;
        let maxY = CY + FACE + 20;
        svg.querySelectorAll("text").forEach((node) => {
          const box = node.getBBox();
          minX = Math.min(minX, box.x);
          minY = Math.min(minY, box.y);
          maxX = Math.max(maxX, box.x + box.width);
          maxY = Math.max(maxY, box.y + box.height);
        });
        const pad = 18;
        svg.setAttribute(
          "viewBox",
          [minX - pad, minY - pad, maxX - minX + pad * 2, maxY - minY + pad * 2]
            .map((n) => n.toFixed(1))
            .join(" "),
        );
      }

      function shiftText(node, tx, ty) {
        node.setAttribute("x", Number(node.getAttribute("x")) + tx);
        node.setAttribute("y", Number(node.getAttribute("y")) + ty);
        node.querySelectorAll("tspan").forEach((part) => {
          if (part.hasAttribute("x")) {
            part.setAttribute("x", Number(part.getAttribute("x")) + tx);
          }
        });
      }

      function polar(radius, deg) {
        const rad = (deg * Math.PI) / 180;
        return [CX + radius * Math.cos(rad), CY + radius * Math.sin(rad)];
      }

      function arc(radius, from, to) {
        const [x0, y0] = polar(radius, from);
        const [x1, y1] = polar(radius, to);
        const large = to - from > 180 ? 1 : 0;
        return `M ${x0.toFixed(1)} ${y0.toFixed(1)} A ${radius} ${radius} 0 ${large} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;
      }

      function anchor(deg) {
        const cos = Math.cos((deg * Math.PI) / 180);
        if (cos < -0.4) return "end";
        if (cos > 0.4) return "start";
        return "middle";
      }

      function majorStep(span) {
        const rough = span / 8;
        const pow = 10 ** Math.floor(Math.log10(rough));
        const steps = [1, 2, 5, 10].map((mult) => mult * pow);
        return (
          steps.find((step) => span / step <= 11) || steps[steps.length - 1]
        );
      }

      function nearAny(value, levels, step) {
        return levels.some(
          (level) => Math.abs(level.point - value) < step * 0.45,
        );
      }

      function gapPhrase(item) {
        const level = item.levels.reduce((best, current) => {
          return Math.abs(item.close - current.point) <
            Math.abs(item.close - best.point)
            ? current
            : best;
        });
        const delta = item.close - level.point;
        const side = delta > 0 ? "高出" : delta < 0 ? "低于" : "贴着";
        if (delta === 0) return side + level.name;
        const pct = (Math.abs(delta) / level.point) * 100;
        return side + level.name + " " + pct.toFixed(1) + "%";
      }

      function formatTick(value) {
        return value.toLocaleString("zh-CN", {
          maximumFractionDigits: value >= 100 ? 0 : 1,
        });
      }

      function formatClose(value) {
        return value.toLocaleString("zh-CN", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        });
      }

      function svgEl(tag, attrs) {
        const node = document.createElementNS(NS, tag);
        Object.entries(attrs).forEach(([key, value]) =>
          node.setAttribute(key, value),
        );
        return node;
      }

      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text) node.textContent = text;
        return node;
      }
    </script>
  </body>
</html>
